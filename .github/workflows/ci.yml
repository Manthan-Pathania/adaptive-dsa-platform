name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Go Monolith Tests & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dsa_user
          POSTGRES_PASSWORD: dsa_password
          POSTGRES_DB: dsa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify Go Modules
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Code Formatting Check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not properly formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://dsa_user:dsa_password@localhost:5432/dsa_db?sslmode=disable
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate status

      - name: Verify Financial Reconciliation Tooling
        env:
          DATABASE_URL: postgres://dsa_user:dsa_password@localhost:5432/dsa_db?sslmode=disable
        run: |
          go run ./cmd/admin reconcile-credits

      - name: Run Unit & Integration Tests with Race Detection
        env:
          DATABASE_URL: postgres://dsa_user:dsa_password@localhost:5432/dsa_db?sslmode=disable
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Build All Production CLI & Server Binaries
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/server ./cmd/server
          go build -trimpath -ldflags="-s -w" -o bin/migrate ./cmd/migrate
          go build -trimpath -ldflags="-s -w" -o bin/admin ./cmd/admin
          go build -trimpath -ldflags="-s -w" -o bin/import-questions ./cmd/import-questions

  frontend-test:
    name: Next.js Frontend Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Next.js Standalone Build
        run: npm run build

  container-build:
    name: Multi-Stage Container Image Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: adaptive-dsa-backend:ci

      - name: Build Next.js Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: adaptive-dsa-frontend:ci
